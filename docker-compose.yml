version: '3.8'

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: skillmatrix_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: skillmatrix_user
      POSTGRES_PASSWORD: skillmatrix_secure_password
      POSTGRES_DB: skillmatrix_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./server/src/db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillmatrix_user -d skillmatrix_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Express REST API Backend Service
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: skillmatrix_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      CORS_ORIGIN: "*"
      DATABASE_URL: postgresql://skillmatrix_user:skillmatrix_secure_password@postgres:5432/skillmatrix_db
    ports:
      - "5000:5000"

  # Production Frontend SPA Service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skillmatrix_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
